<script>
/* ============================================================
   Six pharmacogenomic referrals. The reversal is G1: the child is an
   ULTRA-RAPID CYP2D6 metaboliser and the intuitive reading — "clears it
   fast, so give more" — is exactly backwards, because codeine is a
   prodrug. G6 is the second trap: a genomic result that contradicts the
   clinical picture, where the patient in front of you is the more
   recent evidence.
   ============================================================ */
AlizonLabKit.queue({
  module:'Module 8 · Unit 3 — Clinical & Pharmacogenomic Case Simulations',
  title:'Pharmacogenomic Case Desk',
  unitLabel:'Pharmacy AI · Module 8 · Unit 3 · Practical 1',
  expKey:'pgxdesk',
  workTab:'Case desk',
  opbar:'linear-gradient(120deg,#1a1622,#2a2138)',
  startLabel:'Open the referrals',
  finishHead:'Case desk complete',
  queueHead:'Pharmacogenomic referrals',
  queueFoot:'A genotype is one input. It is never the only one.',
  counterLabel:'Reviewed',
  meterA:'Patient safety', meterB:'Genomic reasoning',
  finishLabel:'Close the desk',
  laterHead:'What became of each referral',
  perItem:10,
  sevWeight:{none:0, moderate:1, major:2, critical:3},
  blurb:'Six patients with genotype results have been referred for a prescribing decision. Read each '+
        'result alongside the clinical picture — and remember which drugs are prodrugs.',
  before:'<p class="muted">Each referral carries the genotype report, the medication list, the clinical '+
         'notes and the relevant guideline. The record stays closed until you open it.</p>'+
         '<p class="muted">Two indices sit alongside your mark: <b>Patient safety</b>, which falls when '+
         'an actionable result is not acted on, and <b>Genomic reasoning</b>, which falls when you decide '+
         'without reading the result you are supposedly acting on.</p>',

  recordTabs:[['gene','Genotype report'],['meds','Medication & indication'],['notes','Clinical notes'],['guide','Guideline extract']],
  actionLabel:'Your action',
  actions:[['proceed','Proceed as prescribed'],
           ['dose','Proceed with an adjusted dose'],
           ['switch','Switch to an alternative agent'],
           ['test','Do not start until the test result is available']],
  reasonLabel:'Principal reason',
  reasons:[['prodrug','Prodrug — metaboliser status inverts the expected effect'],
           ['toxicity','Risk of severe toxicity at standard dose'],
           ['failure','Risk of treatment failure'],
           ['hypersens','Risk of serious hypersensitivity reaction'],
           ['clinical','Clinical picture outweighs the genotype'],
           ['appropriate','Appropriate as prescribed']],

  items:[
   {id:'G1', afterWho:'Aarav, 6 · codeine', after:{ok:'Switched to a non-codeine analgesic. He was comfortable after his tonsillectomy and went home the next day.', bad:'Codeine given as prescribed. As an ultra-rapid metaboliser he converted it to morphine far faster than expected, and with obstructive sleep apnoea already compromising his airway he was found unresponsive and needed naloxone. Children have died in precisely this circumstance.'}, head:'Codeine after tonsillectomy — child', sub:'Aarav, 6 years',
    record:{gene:'CYP2D6: *1/*2xN — ULTRA-RAPID METABOLISER.',
            meds:'Codeine phosphate 3 mg/kg/day in divided doses, prescribed post-operatively.',
            notes:'Day-case tonsillectomy for obstructive sleep apnoea. Discharged home today.',
            guide:'Codeine is CONTRAINDICATED after tonsillectomy or adenoidectomy in children.\nCPIC: avoid codeine in ultra-rapid metabolisers; deaths reported.'},
    need:['gene','guide'], action:'switch', why:'prodrug', sev:'critical',
    truth:'Codeine is a prodrug: CYP2D6 converts it to morphine. An ultra-rapid metaboliser produces morphine faster than expected, so the risk is respiratory depression, not treatment failure — the intuition runs backwards. Combined with obstructive sleep apnoea after tonsillectomy, this is the exact situation in which children have died. Switch to a non-codeine analgesic.'},

   {id:'G2', afterWho:'HLA-B*57:01 · abacavir', after:{ok:'Abacavir avoided and an alternative chosen. This is the single clearest genotype-to-action rule in the whole field.', bad:'Abacavir started. He developed fever, rash and breathlessness on day eight; the reaction is severe and re-challenge can be fatal. The test had already been done and the result was in the record.'}, head:'Abacavir for newly diagnosed HIV', sub:'Mr J Peter, 31',
    record:{gene:'HLA-B*57:01 — POSITIVE.',
            meds:'Abacavir/lamivudine, first prescription, due to start tomorrow.',
            notes:'Newly diagnosed. Otherwise well. No previous antiretroviral exposure.',
            guide:'HLA-B*57:01 testing is mandatory before abacavir.\nA positive result is an absolute contraindication — risk of fatal hypersensitivity.'},
    need:['gene','guide'], action:'switch', why:'hypersens', sev:'critical',
    truth:'A positive HLA-B*57:01 is an absolute contraindication to abacavir. The hypersensitivity reaction is potentially fatal and there is no dose at which it is safe. An alternative regimen must be used.'},

   {id:'G3', afterWho:'TPMT intermediate · azathioprine', after:{ok:'Dose reduced and counts monitored closely. Remission achieved without a haematological crisis.', bad:'Standard dose given. She was neutropenic at three weeks and admitted with sepsis. The enzyme that clears the drug was known in advance to be working at a fraction of normal.'}, head:'Azathioprine for Crohn\'s disease', sub:'Mrs P Nair, 44',
    record:{gene:'TPMT: intermediate activity. NUDT15: normal.',
            meds:'Azathioprine 2.5 mg/kg/day proposed.',
            notes:'Crohn\'s disease, steroid-dependent. Needs a steroid-sparing agent.',
            guide:'TPMT intermediate activity: start at 30-70% of the standard dose\nwith close monitoring of the full blood count.'},
    need:['gene','guide'], action:'dose', why:'toxicity', sev:'major',
    truth:'Intermediate TPMT activity means reduced ability to inactivate the drug and a real risk of myelosuppression at a standard dose. The drug is not contraindicated — it is started at a reduced dose with close blood-count monitoring.'},

   {id:'G4', afterWho:'CYP2C19 poor metaboliser · clopidogrel', after:{ok:'Switched to an antiplatelet that does not need CYP2C19 activation. The stent stayed open.', bad:'Clopidogrel continued. As a prodrug it was barely activated, and he re-presented at five weeks with stent thrombosis. He had been taking his tablets faithfully the entire time.'}, head:'Clopidogrel after coronary stent', sub:'Mr R Sunil, 59',
    record:{gene:'CYP2C19: *2/*2 — POOR METABOLISER.',
            meds:'Clopidogrel 75 mg daily, started after drug-eluting stent 3 days ago.',
            notes:'Recent percutaneous coronary intervention. No bleeding.',
            guide:'CYP2C19 poor metabolisers derive reduced antiplatelet effect from\nclopidogrel. Use an alternative agent where possible.'},
    need:['gene','notes'], action:'switch', why:'failure', sev:'major',
    truth:'Clopidogrel is a prodrug requiring CYP2C19 activation. A poor metaboliser generates little active drug, so the risk here is treatment failure — stent thrombosis — rather than toxicity. An alternative antiplatelet should be used.'},

   {id:'G5', afterWho:'DPYD variant · capecitabine', after:{ok:'Dose reduced from the outset. Treatment proceeded with manageable toxicity.', bad:'Full dose given. Severe mucositis, diarrhoea and neutropenia followed within the first cycle, treatment was abandoned, and the toxicity from this deficiency can be fatal. The result was available before the first dose.'}, head:'Capecitabine for colorectal cancer', sub:'Mrs K Antony, 63',
    record:{gene:'DPYD: heterozygous for a no-function variant.',
            meds:'Capecitabine, first cycle due Monday.',
            notes:'Adjuvant treatment after resection. Performance status 0.',
            guide:'DPYD variant carriers have reduced fluoropyrimidine clearance.\nHeterozygous: start at 50% of the standard dose and titrate on tolerance.'},
    need:['gene','guide'], action:'dose', why:'toxicity', sev:'critical',
    truth:'Reduced dihydropyrimidine dehydrogenase activity means the fluoropyrimidine is cleared slowly, with a risk of severe and sometimes fatal toxicity. Treatment proceeds at a substantially reduced starting dose with titration, not at the standard dose.'},

   {id:'G6', afterWho:'Mr Jacob · warfarin', after:{ok:'The stable dose was left alone. Fourteen months of in-range INRs outrank a prediction of what the dose ought to be.', bad:'The dose was reduced to match the genotype. His INR fell subtherapeutic and he had a stroke seven weeks later. The genotype predicted a requirement; his INR record had already measured it.'}, head:'Warfarin — genotype suggests low dose', sub:'Mr M Jacob, 70',
    record:{gene:'VKORC1 AA and CYP2C9 *1/*3 — predicted low warfarin requirement.',
            meds:'Warfarin, currently stable on 6 mg daily for 14 months.',
            notes:'Atrial fibrillation. INR has been in range at every check for 14 months.\nGenotyping done as part of a research study, result returned now.',
            guide:'VKORC1/CYP2C9 genotype informs the STARTING dose. It does not\noverride an established, stable maintenance dose.'},
    need:['notes','guide'], action:'proceed', why:'clinical', sev:'none',
    truth:'This is the second trap. The genotype predicts a lower requirement, but the patient has been stable at 6 mg with in-range INRs for fourteen months. Genotype informs the starting dose; fourteen months of measured response is far stronger evidence than a prediction. Changing a stable dose on a retrospective genotype would destabilise him for no benefit.'}
  ],

  outcome:function(S,M){
    var g1=S.done.G1, g6=S.done.G6;
    return '<h3 style="margin-top:16px">What the results meant</h3>'
      +'<p><b>Aarav (G1)</b> was an ultra-rapid CYP2D6 metaboliser prescribed codeine after tonsillectomy '
      +'for sleep apnoea. Because codeine is a prodrug, ultra-rapid metabolism means <i>more</i> morphine, '
      +'faster — the opposite of the intuitive reading, and the precise circumstance in which children '
      +'have died. '+((g1&&g1.actOk)?'You switched the analgesic.':'The codeine was allowed to proceed.')+'</p>'
      +'<p><b>Mr Jacob (G6)</b> had a genotype predicting a low warfarin requirement and fourteen months of '
      +'in-range INRs at 6 mg. '+((g6&&g6.actOk)
        ? 'You left the stable dose alone — the measured response outweighs the prediction.'
        : 'His dose was changed on the strength of a prediction, against fourteen months of measured '
          +'evidence that it was already right.')+'</p>'
      +'<div class="fb yes" style="margin-top:8px"><div class="hd">The two rules</div>First, ask whether the '
      +'drug is a prodrug before predicting the consequence of metaboliser status — codeine, clopidogrel and '
      +'tamoxifen all invert the intuition. Second, a genotype is a probability and a stable clinical course '
      +'is a measurement; when they disagree, the patient in front of you is the more recent evidence.</div>'
      +'<div class="fb yes" style="margin-top:8px"><div class="hd">And record it</div>Every one of these '
      +'results is durable — it will not change for the rest of the patient\'s life. A result that is lost '
      +'when the patient moves hospital has been wasted.</div>';
  },

  reportLabel:'Case desk outcome',
  reportPlaceholder:'e.g. 60/60 — codeine switched in an ultra-rapid metaboliser; stable warfarin dose left unchanged',
  attachments:[{label:'1. Case Desk Report / Printout (PDF)'},
               {label:'2. Reflection on prodrugs and genotype vs clinical evidence (PDF)'}]
});
</script>
