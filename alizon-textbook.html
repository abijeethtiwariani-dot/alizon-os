<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Textbook Studio — ALIZON AOS</title>
<meta name="description" content="Compose and typeset module textbooks for the Alizon School of Medical &amp; Digital Intelligence.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="alizon-logo.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
/* ============================================================
   ALIZON Textbook Studio
   Left: source in the Alizon textbook markup.  Right: the typeset
   book, flowed into real A4 pages so the contents page can carry
   true page numbers and printing is exact.
   ============================================================ */
:root{
  --crimson:#b1040e; --crimson-dark:#8a0009; --ink:#111; --muted:#2e2d29;
  --line:#e6e6e6; --paper:#fff; --app-bg:#f4f2ef; --gold:#9a7b3f;
  --serif:"Source Serif Pro",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--app-bg);color:var(--ink);font-family:var(--sans);font-size:14px}

/* ---------- app chrome ---------- */
.appbar{position:sticky;top:0;z-index:50;background:linear-gradient(120deg,#6b0f0f,#8c1515);color:#fff;
  padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 14px rgba(0,0,0,.16)}
.appbar img{height:30px;width:auto;filter:brightness(0) invert(1)}
.appbar h1{font-family:var(--serif);font-size:17px;margin:0;font-weight:700;letter-spacing:.01em}
.appbar .sub{font-size:11px;opacity:.85;letter-spacing:.09em;text-transform:uppercase}
.spacer{flex:1}
.btn{font:inherit;font-size:12.5px;font-weight:700;padding:8px 15px;border-radius:100px;border:1px solid rgba(255,255,255,.5);
  background:transparent;color:#fff;cursor:pointer;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.solid{background:#fff;color:var(--crimson);border-color:#fff}
.btn.solid:hover{background:#ffeaea}

.layout{display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,1.25fr);gap:0;height:calc(100vh - 51px)}
@media(max-width:980px){ .layout{grid-template-columns:1fr;height:auto} .editorPane{height:60vh} }

/* ---------- editor ---------- */
.editorPane{display:flex;flex-direction:column;border-right:1px solid var(--line);background:#fbfaf9;min-height:0}
.metaGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px 10px;padding:11px 14px;border-bottom:1px solid var(--line);background:#fff}
.metaGrid label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6b6560;margin-bottom:3px}
.metaGrid input,.metaGrid select{width:100%;font:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
.tools{display:flex;flex-wrap:wrap;gap:5px;padding:9px 14px;border-bottom:1px solid var(--line);background:#f7f5f3}
.tools button{font:inherit;font-size:11px;font-weight:600;padding:5px 10px;border-radius:6px;border:1px solid var(--line);
  background:#fff;color:var(--muted);cursor:pointer}
.tools button:hover{border-color:var(--crimson);color:var(--crimson)}
#src{flex:1;min-height:200px;width:100%;border:0;outline:0;resize:none;padding:14px 16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.6px;line-height:1.72;background:#fbfaf9;color:#24211f;tab-size:2}
.statusbar{padding:7px 14px;border-top:1px solid var(--line);background:#fff;font-size:11.5px;color:#6b6560;display:flex;gap:14px;flex-wrap:wrap}

/* ---------- preview shell ---------- */
.previewPane{overflow:auto;background:#e9e6e2;padding:22px 0 60px;min-height:0}
.pagewrap{display:flex;flex-direction:column;align-items:center;gap:20px}

/* ============================================================
   THE BOOK — A4 pages
   ============================================================ */
.page{
  width:210mm;height:297mm;background:var(--paper);position:relative;overflow:hidden;
  box-shadow:0 6px 26px rgba(0,0,0,.16);flex:none;
  font-family:var(--serif);color:var(--ink);
}
.page .content{position:absolute;left:22mm;right:18mm;top:20mm;bottom:18mm;overflow:hidden}
.page.left .content{left:18mm;right:22mm}          /* mirrored inner margin */
.runhead{position:absolute;top:11mm;left:22mm;right:18mm;display:flex;justify-content:space-between;gap:8mm;
  font-family:var(--sans);font-size:8pt;letter-spacing:.06em;text-transform:uppercase;color:#8d8781;
  border-bottom:.4pt solid #ddd8d3;padding-bottom:2.5mm}
.runhead span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}
.runhead .rr{text-align:right}
/* a chapter opening page carries no running head — standard book practice */
.page.chapstart .runhead{display:none}
.page.left .runhead{left:18mm;right:22mm}
.folio{position:absolute;bottom:11mm;left:22mm;right:18mm;font-family:var(--sans);font-size:8.5pt;color:#6b6560;text-align:right}
.page.left .folio{left:18mm;right:22mm;text-align:left}
.page.plain .runhead,.page.plain .folio{display:none}

/* body typography */
.page p{margin:0 0 2.6mm;font-size:10.9pt;line-height:1.62;text-align:justify;hyphens:auto}
.page p.first{text-indent:0}
.page p.cont{text-indent:5mm;margin-top:0}
.page h2.chapnum{font-family:var(--sans);font-size:9.5pt;letter-spacing:.22em;text-transform:uppercase;color:var(--crimson);margin:0 0 2mm;font-weight:800}
.page h1.chaptitle{font-size:23pt;line-height:1.16;margin:0 0 5mm;font-weight:700;letter-spacing:-.01em}
.page h3.sec{font-family:var(--sans);font-size:12.5pt;font-weight:800;margin:6.5mm 0 2.4mm;color:#1a1512;letter-spacing:-.005em}
.page h4.sub{font-family:var(--sans);font-size:10.8pt;font-weight:700;margin:4.6mm 0 1.8mm;color:#3a332e}
.page ul,.page ol{margin:0 0 2.8mm;padding-left:6mm}
.page li{font-size:10.9pt;line-height:1.6;margin-bottom:1.1mm}
.page b,.page strong{font-weight:700}

/* callout boxes */
.box{border-radius:2.4mm;padding:3.6mm 4.4mm;margin:0 0 3.4mm;font-size:10.2pt;line-height:1.56;break-inside:avoid}
.box .bt{font-family:var(--sans);font-size:8.6pt;font-weight:800;letter-spacing:.11em;text-transform:uppercase;margin-bottom:1.6mm;display:block}
.box p{font-size:10.2pt;margin-bottom:1.6mm;text-align:left}
.box p:last-child{margin-bottom:0}
.box ul{margin-bottom:0}
.box li{font-size:10.2pt}
.box.obj{background:#fdf3f3;border:.5pt solid rgba(177,4,14,.28);border-left:1.4mm solid var(--crimson)}
.box.obj .bt{color:var(--crimson)}
.box.know{background:#f3f7fb;border:.5pt solid #c3d5e6;border-left:1.4mm solid #2c6ea5}
.box.know .bt{color:#1f5480}
.box.activity{background:#f2f9f3;border:.5pt solid #c2ddc7;border-left:1.4mm solid #2e7d43}
.box.activity .bt{color:#226334}
.box.note{background:#fbf7ec;border:.5pt solid #e3d4ac;border-left:1.4mm solid var(--gold)}
.box.note .bt{color:#7d6229}
.box.caution{background:#fdf1ee;border:.5pt solid #f0c4b6;border-left:1.4mm solid #c2410c}
.box.caution .bt{color:#9a3412}
.box.summary{background:#faf9f7;border:.5pt solid #ddd8d3;border-top:1.4mm solid var(--crimson)}
.box.summary .bt{color:var(--crimson)}
.box.keyterms{background:#fff;border:.5pt solid #ddd8d3}
.box.keyterms .bt{color:var(--gold)}
.box.keyterms dl{margin:0}
.box.keyterms dt{font-weight:700;font-size:10.2pt;margin-top:1.4mm}
.box.keyterms dd{margin:0 0 0 0;font-size:10.1pt;line-height:1.5;color:#3a332e}
.box.quote{background:#fff;border:0;border-left:1.4mm solid #ddd8d3;font-style:italic;color:#3a332e;padding-left:4mm}

/* figures & tables */
figure{margin:0 0 3.6mm;break-inside:avoid}
figure .ph{border:.5pt dashed #c8c2bc;background:#faf9f7;border-radius:2mm;height:42mm;display:flex;align-items:center;
  justify-content:center;color:#a29b95;font-family:var(--sans);font-size:9pt}
figure img{width:100%;height:auto;border-radius:2mm;display:block}
figure.dia svg{display:block;width:100%;height:auto}
.page code{font-family:ui-monospace,Menlo,monospace;font-size:.92em;background:#f4f2ef;padding:0 .3em;border-radius:2px}
figcaption{font-family:var(--sans);font-size:8.8pt;color:#5f5a54;margin-top:1.8mm;line-height:1.45}
figcaption b{color:var(--crimson)}
table.bk{width:100%;border-collapse:collapse;margin:0 0 1.8mm;font-size:9.9pt;break-inside:avoid}
table.bk th{background:#f7f3f0;border:.5pt solid #ddd8d3;padding:2mm 2.6mm;text-align:left;font-family:var(--sans);font-size:9pt;font-weight:800}
table.bk td{border:.5pt solid #e6e2de;padding:2mm 2.6mm;vertical-align:top;line-height:1.45}
.tcap{font-family:var(--sans);font-size:8.8pt;color:#5f5a54;margin:0 0 3.6mm}
.tcap b{color:var(--crimson)}

/* exercises */
.exwrap{break-inside:avoid}
.exwrap .bt{font-family:var(--sans);font-size:8.6pt;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--crimson);display:block;margin:0 0 2.4mm;border-top:1.4mm solid var(--crimson);padding-top:2.4mm}
.exwrap ol{padding-left:6mm}
.exwrap li{margin-bottom:1.9mm;font-size:10.5pt}

/* ---------- cover ---------- */
.cover{position:absolute;inset:0;display:flex;flex-direction:column;color:#fff;
  background:linear-gradient(155deg,#6b0f0f 0%,#8c1515 42%,#b1040e 100%)}
.cover .cvtop{padding:20mm 20mm 0;display:flex;align-items:center;gap:5mm}
.cover .cvtop img{height:15mm;filter:brightness(0) invert(1)}
.cover .cvtop .inst{font-family:var(--sans);font-size:10pt;font-weight:700;line-height:1.32;letter-spacing:.02em}
.cover .cvtop .inst small{display:block;font-weight:500;font-size:8.2pt;opacity:.85;letter-spacing:.1em;text-transform:uppercase;margin-top:1mm}
.cover .cvmid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 20mm}
.cover .eyebrow{font-family:var(--sans);font-size:9.5pt;letter-spacing:.28em;text-transform:uppercase;opacity:.9;margin-bottom:6mm}
.cover h1{font-size:34pt;line-height:1.1;margin:0 0 6mm;font-weight:700;letter-spacing:-.015em}
.cover .csub{font-size:14pt;line-height:1.4;opacity:.93;font-style:italic;margin-bottom:9mm}
.cover .rule{width:38mm;height:1.6mm;background:#fff;opacity:.9;margin-bottom:9mm}
.cover .cprog{font-family:var(--sans);font-size:10.5pt;line-height:1.6;opacity:.94}
.cover .cvbot{padding:0 20mm 18mm;font-family:var(--sans);font-size:9pt;opacity:.85;display:flex;justify-content:space-between;align-items:flex-end}
.cover .wm{position:absolute;right:-30mm;bottom:-30mm;width:150mm;height:150mm;border-radius:50%;
  background:rgba(255,255,255,.055)}
.cover .wm2{position:absolute;right:10mm;top:-40mm;width:100mm;height:100mm;border-radius:50%;background:rgba(255,255,255,.04)}

/* ---------- imprint / contents ---------- */
.imprint{font-size:9.6pt;line-height:1.62;color:#3a332e}
.imprint h5{font-family:var(--sans);font-size:9pt;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--crimson);margin:0 0 3mm}
.imprint p{font-size:9.6pt;text-align:left;margin-bottom:2.6mm}
.imprint .rule{height:.5pt;background:#ddd8d3;margin:5mm 0}
.tocH{font-size:20pt;font-weight:700;margin:0 0 6mm;letter-spacing:-.01em}
.tocrow{display:flex;align-items:baseline;gap:2mm;margin-bottom:2.6mm;font-size:10.6pt}
.tocrow .tno{font-family:var(--sans);font-weight:800;color:var(--crimson);min-width:11mm;font-size:9.6pt}
.tocrow .tt{flex:0 1 auto}
.tocrow .dots{flex:1;border-bottom:.5pt dotted #c8c2bc;transform:translateY(-1mm)}
.tocrow .tp{font-family:var(--sans);font-size:9.6pt;color:#3a332e;font-variant-numeric:tabular-nums}
.tocrow.sub{margin-left:11mm;font-size:9.9pt;color:#3a332e}
.tocrow.sub .tno{min-width:12mm;font-weight:600;color:#8d8781}

/* chapter opener */
.chopen{border-bottom:1.6mm solid var(--crimson);padding-bottom:5mm;margin-bottom:6mm}

.emptyState{padding:60px 30px;text-align:center;color:#8d8781;font-family:var(--sans)}

/* ---------- format guide ---------- */
.ov{position:fixed;inset:0;z-index:200;background:rgba(12,6,8,.55);display:flex;align-items:center;justify-content:center;padding:24px}
.ovbox{background:#fff;max-width:780px;width:100%;max-height:86vh;overflow:auto;border-radius:16px;padding:26px 30px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.ovbox h2{font-family:var(--serif);font-size:21px;margin:0 0 4px}
.ovbox .lead{font-size:13px;color:#6b6560;margin:0 0 18px;line-height:1.6}
.ovbox h3{font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--crimson);margin:20px 0 8px}
.gt{width:100%;border-collapse:collapse;font-size:12.6px}
.gt td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top;line-height:1.55}
.gt td:first-child{width:34%;white-space:nowrap}
.gt code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#f6f3f1;padding:2px 6px;border-radius:4px;color:#8a0009}

/* ============================================================
   PRINT — pages are already exact, so just strip the app
   ============================================================ */
@media print{
  @page{ size:A4; margin:0 }
  body{background:#fff}
  .appbar,.editorPane,.statusbar,.tools,.metaGrid{display:none!important}
  .layout{display:block;height:auto}
  .previewPane{overflow:visible;padding:0;background:#fff}
  .pagewrap{gap:0}
  .page{box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>

<div class="appbar">
  <img src="alizon-logo.png" alt="Alizon">
  <div>
    <h1>Textbook Studio</h1>
    <div class="sub">Alizon School of Medical &amp; Digital Intelligence</div>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="btnImport">Import</button>
  <button class="btn" id="btnGuide">Format guide</button>
  <button class="btn" id="btnStarter">Load module book</button>
  <button class="btn" id="btnWhole">Load whole programme</button>
  <button class="btn" id="btnSmart">Smart import</button>
  <button class="btn" id="btnSave">Save</button>
  <button class="btn" id="btnOpen">Open</button>
  <button class="btn" id="btnExport">Export</button>
  <button class="btn" id="btnCombine">Combine volume</button>
  <button class="btn" id="btnPublish">Publish to students</button>
  <button class="btn" id="btnPubAll">Publish all 8</button>
  <button class="btn solid" id="btnPrint">Print / PDF</button>
</div>

<div class="layout">
  <!-- ================= EDITOR ================= -->
  <div class="editorPane">
    <div class="metaGrid">
      <div><label>Module</label>
        <select id="mModule"><option value="">—</option></select></div>
      <div><label>Book title</label><input id="mTitle" placeholder="Artificial Intelligence in Pharmacy Practice"></div>
      <div><label>Subtitle</label><input id="mSub" placeholder="A Practice-Based Introduction"></div>
      <div><label>Programme</label><input id="mProg" placeholder="Certificate Course in Digital Health & Artificial Intelligence for Pharmacy"></div>
      <div><label>Edition</label><input id="mEd" placeholder="First Edition · 2026"></div>
      <div><label>Authors</label><input id="mAuth" placeholder="Dr Abijeeth Tiwari, Dr Ismail, Anandhu A P"></div>
      <div><label>Print / export scope</label>
        <select id="mScope"><option value="all">Whole book — all units</option></select></div>
    </div>

    <div class="tools" id="tools"></div>
    <textarea id="src" spellcheck="false" placeholder="Write or paste your chapter text here.

Use @chapter, @section, @objectives … or paste plain text and press “Smart import”."></textarea>
    <div class="statusbar">
      <span id="stChap">0 chapters</span>
      <span id="stWords">0 words</span>
      <span id="stPages">0 pages</span>
      <span id="stSaved" style="margin-left:auto"></span>
    </div>
  </div>

  <!-- ================= PREVIEW ================= -->
  <div class="previewPane">
    <div class="pagewrap" id="pages">
      <div class="emptyState">The typeset book appears here as you write.</div>
    </div>
  </div>
</div>

<script src="firebase-sync.js"></script>
<script src="alizon-exam-manifest.js?v=3"></script>
<script src="alizon-textbook-render.js?v=3"></script>
<script src="alizon-textbook-content.js?v=1"></script>
<script>
(function(){
'use strict';
var $=function(id){ return document.getElementById(id); };
/* Parser and renderer live in alizon-textbook-render.js so the studio and the
   student library can never drift apart. */
var esc=AlizonBook.esc, inl=AlizonBook.inl, parse=AlizonBook.parse, renderChapter=AlizonBook.renderChapter;
function el(html){ var d=document.createElement('div'); d.innerHTML=String(html).trim(); return d.firstChild; }

/* ============================================================
   3. PAGINATE — flow elements into real A4 pages
   ============================================================ */
var meta={};
function metaRead(){
  return {
    module:$('mModule').value, title:$('mTitle').value.trim(), sub:$('mSub').value.trim(),
    prog:$('mProg').value.trim(), ed:$('mEd').value.trim(), auth:$('mAuth').value.trim()
  };
}

function makePage(cls){
  var p=document.createElement('div');
  p.className='page'+(cls?' '+cls:'');
  p.innerHTML='<div class="runhead"><span class="rl"></span><span class="rr"></span></div>'
             +'<div class="content"></div><div class="folio"></div>';
  return p;
}

function coverPage(m){
  var p=makePage('plain');
  var title=m.title||'Module Textbook';
  var modline=m.module?('Module '+m.module):'';
  p.innerHTML='<div class="cover"><div class="wm"></div><div class="wm2"></div>'
    +'<div class="cvtop"><img src="alizon-logo.png" alt="">'
      +'<div class="inst">Alizon School of Medical &amp; Digital Intelligence<small>ALIZON AOS · Kerala, India</small></div></div>'
    +'<div class="cvmid">'
      +(modline?'<div class="eyebrow">'+esc(modline)+'</div>':'')
      +'<h1>'+esc(title)+'</h1>'
      +(m.sub?'<div class="csub">'+esc(m.sub)+'</div>':'')
      +'<div class="rule"></div>'
      +'<div class="cprog">'+(m.prog?esc(m.prog)+'<br>':'')+(m.auth?esc(m.auth):'')+'</div>'
    +'</div>'
    +'<div class="cvbot"><span>'+esc(m.ed||'')+'</span><span>alizon.in</span></div>'
  +'</div>';
  return p;
}

function imprintPage(m){
  var p=makePage('plain');
  var y=new Date().getFullYear();
  p.querySelector('.content').innerHTML=
    '<div class="imprint" style="position:absolute;bottom:0;left:0;right:0">'
    +'<h5>About this book</h5>'
    +'<p><b>'+esc(m.title||'Module Textbook')+'</b>'+(m.sub?' — '+esc(m.sub):'')+'</p>'
    +(m.prog?'<p>Prepared for the '+esc(m.prog)+'.</p>':'')
    +'<div class="rule"></div>'
    +'<p>'+esc(m.ed||('First Edition · '+y))+'</p>'
    +'<p>© '+y+' Alizon School of Medical &amp; Digital Intelligence. '
    +'Prepared for the instruction of enrolled students. No part of this book may be reproduced or '
    +'distributed outside the institution without written permission.</p>'
    +(m.auth?'<p><b>Prepared by:</b> '+esc(m.auth)+'</p>':'')
    +'<p><b>Published by:</b> Alizon School of Medical &amp; Digital Intelligence, Kerala, India · alizon.in</p>'
    +'</div>';
  return p;
}

function paginate(chapters, m){
  var wrap=$('pages');
  wrap.innerHTML='';
  if(!chapters.length){ wrap.innerHTML='<div class="emptyState">The typeset book appears here as you write.</div>'; return {pages:0}; }

  /* front matter */
  wrap.appendChild(coverPage(m));
  wrap.appendChild(imprintPage(m));
  var tocPage=makePage('plain');
  tocPage.querySelector('.content').innerHTML='<div class="tocH">Contents</div><div id="tocBody"></div>';
  wrap.appendChild(tocPage);

  /* body pages */
  /* verso carries the book, recto the chapter — so the two never read as a duplicate */
  var runL=m.title||(m.module?'Module '+m.module:'ALIZON AOS');
  var folio=0, page=null, content=null, curChapTitle='', chapStart=false;
  var toc=[];

  function newPage(){
    /* a chapter that happens to end exactly at a page boundary must not leave a blank */
    if(content && content.children.length===0){
      if(chapStart) page.classList.add('chapstart');
      return;
    }
    folio++;
    page=makePage((folio%2===0?'left':'')+(chapStart?' chapstart':''));
    page.querySelector('.rl').textContent=runL;
    page.querySelector('.rr').textContent=curChapTitle;
    page.querySelector('.folio').textContent=folio;
    wrap.appendChild(page);
    content=page.querySelector('.content');
  }
  function fits(){ return content.scrollHeight <= content.clientHeight; }

  /* An imported manuscript can contain a table taller than a page. Alone on a
     fresh page it would simply be clipped and rows lost, so split it and repeat
     the header on each continuation. Anything else oversized is left as-is —
     clipping a paragraph loses less than silently dropping a table's rows. */
  function splitOversized(node){
    var table = node.matches && node.matches('table') ? node : node.querySelector && node.querySelector('table');
    if(!table) return;
    var head = table.querySelector('tr');
    var rows = [].slice.call(table.querySelectorAll('tr')).slice(1);
    if(rows.length < 2) return;
    var guard = 0;
    while(!fits() && rows.length > 1 && guard++ < 200){
      var last = rows.pop();
      if(last && last.parentNode) last.parentNode.removeChild(last);
      carry.unshift(last);
    }
    if(!carry.length) return;
    var moved = carry.splice(0, carry.length);
    newPage();
    var cont = table.cloneNode(false);
    if(head) cont.appendChild(head.cloneNode(true));
    moved.forEach(function(r){ cont.appendChild(r); });
    var wrap = document.createElement('div');
    wrap.className = 'tblwrap';
    wrap.appendChild(cont);
    content.appendChild(wrap);
    if(!fits()) splitOversized(wrap);
  }
  var carry = [];


  chapters.forEach(function(ch, idx){
    var items=renderChapter(ch, idx+1);
    curChapTitle=ch.title;
    items.forEach(function(it, k){
      if(it.newPage || !page){
        chapStart=!!it.newPage; newPage(); chapStart=false;
        if(it.newPage) page.querySelector('.rr').textContent=ch.title;
      }
      if(it.forceBreak){ newPage(); return; }
      content.appendChild(it.node);
      if(!fits()){
        /* does not fit — move to a fresh page, and take any heading that would
           otherwise be left stranded at the foot of the page we are leaving */
        content.removeChild(it.node);
        var leaving=content, trailing=leaving.lastElementChild;
        var dragHeading = trailing && /^(H3|H4)$/.test(trailing.tagName) ? trailing : null;
        if(dragHeading) leaving.removeChild(dragHeading);
        newPage();
        if(dragHeading) content.appendChild(dragHeading);
        content.appendChild(it.node);
        if(!fits()) splitOversized(it.node);
        /* a single element taller than the page simply stays and is clipped-safe:
           it is the only thing on its page, so nothing is lost visually */
      }
      if(it.toc) toc.push({lvl:it.toc.lvl, no:it.toc.no, text:it.toc.text, page:folio});
    });
    /* a heading must never sit alone at the foot of a page */
    var last=content.lastElementChild;
    if(last && /^(H3|H4)$/.test(last.tagName)){ content.removeChild(last); newPage(); content.appendChild(last); }
  });

  /* Contents, flowed across as many pages as it needs. A long book has more
     entries than one page holds, and a clipped contents page silently loses
     whole units from the listing. Body folios are unaffected: contents pages
     are front matter and carry no folio. */
  var tb=tocPage.querySelector('#tocBody');
  if(!toc.length){
    tb.innerHTML='<p style="font-size:10pt;color:#8d8781">No units yet.</p>';
  } else {
    var firstBody=tocPage.nextSibling;
    var tocContent=tocPage.querySelector('.content');
    var tocBox=tb;
    toc.forEach(function(t){
      var row=el('<div class="tocrow'+(t.lvl===2?' sub':'')+'">'
        +'<span class="tno">'+esc(t.lvl===1?('Unit '+t.no):t.no)+'</span>'
        +'<span class="tt">'+esc(t.text)+'</span><span class="dots"></span>'
        +'<span class="tp">'+t.page+'</span></div>');
      tocBox.appendChild(row);
      if(tocContent.scrollHeight > tocContent.clientHeight){
        tocBox.removeChild(row);
        var cont=makePage('plain');
        cont.querySelector('.content').innerHTML='<div class="tocH">Contents <span style="font-size:11pt;font-weight:400;color:#8d8781">(continued)</span></div><div class="tocBody"></div>';
        wrap.insertBefore(cont, firstBody);
        tocContent=cont.querySelector('.content');
        tocBox=cont.querySelector('.tocBody');
        tocBox.appendChild(row);
      }
    });
  }

  return {pages:wrap.querySelectorAll('.page').length};
}

/* ---------- scope: whole book, or one unit ----------
   One chapter = one syllabus unit, so "unit-wise download" is chapter-wise.
   The scope narrows what is typeset, so print and export follow it too. */
/* Slice the RAW source at @chapter boundaries rather than regenerating markup
   from the parse tree — regenerating would quietly drop anything the parser
   normalises, and an export should be exactly what the author wrote. */
function sliceUnit(text, idx){
  var lines=String(text||'').replace(/\r/g,'').split('\n');
  var starts=[];
  lines.forEach(function(l,i){ if(/^@chapter\b/.test(l.trim())) starts.push(i); });
  if(idx<0 || idx>=starts.length) return text;
  var from=starts[idx], to=(idx+1<starts.length)?starts[idx+1]:lines.length;
  return lines.slice(from,to).join('\n').replace(/\s+$/,'')+'\n';
}
function scopeChapters(all){
  var v=$('mScope').value;
  if(v==='all' || !all.length) return all;
  var i=parseInt(v,10);
  return (i>=0 && i<all.length) ? [all[i]] : all;
}
function syncScopeOptions(all){
  var sel=$('mScope'), keep=sel.value;
  var want='all|'+all.map(function(c){ return c.title; }).join('|');
  if(sel.getAttribute('data-sig')===want) return;
  sel.setAttribute('data-sig', want);
  sel.innerHTML='<option value="all">Whole book — all units</option>'
    +all.map(function(c,i){ return '<option value="'+i+'">Unit '+(i+1)+' — '+esc(c.title).slice(0,44)+'</option>'; }).join('');
  sel.value = (keep && sel.querySelector('option[value="'+keep+'"]')) ? keep : 'all';
}
function scopeLabel(){
  var v=$('mScope').value;
  if(v==='all') return '';
  var all=parse($('src').value), i=parseInt(v,10);
  return (all[i] ? ' — Unit '+(i+1)+': '+all[i].title : '');
}

var tRender=null;
function render(){

  if($('mScope').value!=='all' && chapters.length===1){
    m=Object.assign({}, m, {sub:(m.sub?m.sub+' · ':'')+'Unit '+(parseInt($('mScope').value,10)+1)});
  }

/* ---------- embed an image ----------
   Photographs are re-encoded to at most 1100px wide JPEG before they go in.
   A phone photo is 3–5 MB; base64 adds another third; the whole book must fit
   in one 1 MB document. Downsizing is the difference between "works" and
   "cannot be published at all". */
function pickImage(){
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.addEventListener('change', function(){
    var f=inp.files && inp.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var MAXW=1100;
        var w=img.width, h=img.height;
        if(w>MAXW){ h=Math.round(h*MAXW/w); w=MAXW; }
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        var url;
        try{ url=c.toDataURL('image/jpeg',0.78); }
        catch(e){ alert('That image could not be read.'); return; }
        var kb=Math.round(url.length/1024);
        if(kb>320 && !confirm('This image is '+kb+' KB after shrinking, which is a large slice of the 1 MB a book gets.\n\nEmbed it anyway?')) return;
        insert('@figure '+url+' | Caption for this image\n\n');
        $('stSaved').textContent='Image embedded — '+kb+' KB ('+w+'×'+h+')';
      };
      img.onerror=function(){ alert('That file is not an image this browser can read.'); };
      img.src=fr.result;
    };
    fr.readAsDataURL(f);
  });
  inp.click();
}

function insert(txt){

  var ta=$('src'), a=ta.selectionStart, b=ta.selectionEnd, v=ta.value;

/* ---------- smart import: plain prose → markup ---------- */
function smartImport(){
  var v=$('src').value;
  if(!v.trim()){ alert('Paste your plain text into the editor first, then press Smart import.'); return; }
  if(/^@chapter/m.test(v) && !confirm('This text already uses @chapter markers. Run smart import anyway?')) return;
  var lines=v.replace(/\r/g,'').split('\n'), out=[], firstHeading=true;
  for(var i=0;i<lines.length;i++){
    var L=lines[i], t=L.trim();
    if(t===''){ out.push(''); continue; }
    if(/^@/.test(t)){ out.push(L); continue; }
    var next=(lines[i+1]||'').trim();
    var numbered=/^(\d+)\.(\d+)(\.(\d+))?\s+\S/.exec(t);      // 1.2  or 1.2.3
    var chapNum=/^(chapter|unit)\s+\d+\b[:.\s-]*(.*)$/i.exec(t);
    var shortLine = t.length<=72 && !/[.;:,]$/.test(t) && next==='';
    var titleCase = /^[A-Z0-9]/.test(t) && t.split(/\s+/).length<=12;

    if(chapNum){ out.push('@chapter '+(chapNum[2]||t)); firstHeading=false; continue; }
    if(numbered && numbered[4]){ out.push('@subsection '+t.replace(/^\d+(\.\d+)+\s+/,'')); continue; }
    if(numbered){ out.push('@section '+t.replace(/^\d+(\.\d+)+\s+/,'')); continue; }
    if(/^(learning outcomes?|objectives?)\s*:?$/i.test(t)){ out.push('@objectives'); continue; }
    if(/^(summary|what we have learnt)\s*:?$/i.test(t)){ out.push('@summary'); continue; }
    if(/^(key ?terms?|glossary)\s*:?$/i.test(t)){ out.push('@keyterms'); continue; }
    if(/^(exercises?|questions?|review questions?)\s*:?$/i.test(t)){ out.push('@exercise Exercises'); continue; }
    if(/^(activity|try this)\b/i.test(t)){ out.push('@activity '+t); continue; }
    if(/^(did you know|do you know)\b/i.test(t)){ out.push('@know '+t); continue; }
    if(/^(note|remember)\s*:?$/i.test(t)){ out.push('@note'); continue; }
    if(/^(caution|warning)\s*:?$/i.test(t)){ out.push('@caution'); continue; }
    if(shortLine && titleCase){
      out.push(firstHeading ? '@chapter '+t : '@section '+t);
      firstHeading=false; continue;
    }
    out.push(L);
  }
  var res=out.join('\n');
  if(!/^@chapter/m.test(res)) res='@chapter '+($('mTitle').value.trim()||'Chapter 1')+'\n\n'+res;
  $('src').value=res;
  render();
}

var STORE='alizonTextbooks';

  var i=-1; a.forEach(function(x,j){ if(x.key===k) i=j; });
  if(i>=0) a[i]=rec; else a.push(rec);

/* ============================================================
   PUBLISHING
   Each published book is its OWN Firestore document under sync/, so it
   gets its own 1 MB budget instead of sharing one with every other
   record. Verified against the live rules: arbitrary sync/<id> docs are
   writable, a brand-new collection is denied. Only the compact source
   markup is stored — the reader re-renders it with the same
   alizon-textbook-render.js the studio uses.
   ============================================================ */
var IDX_DOC='alizonBookIndex', DOC_LIMIT=1048576;
function fb(){
  try{
    if(typeof firebase==='undefined' || !firebase.apps || !firebase.apps.length) return null;
    if(!firebase.auth().currentUser) return null;
    return firebase.firestore();
  }catch(e){ return null; }
}
/* The id must include the course. Module numbers restart at 1 in every
   programme, so an id of "m1" alone would let a future Paramedical Module 1
   silently overwrite Pharmacy Module 1 in the library. */
function courseSlug(m){
  var p=(m.prog||'').toLowerCase().replace(/\b(diploma|certificate|degree|programme|program|course|in|of|the)\b/g,' ')
        .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return p || 'general';
}
function bookId(m){
  var c=courseSlug(m);
  return m.module ? (c+'-m'+m.module)
    : (c+'-'+(m.title||'book').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40));
}
function waitForFb(ms){
  return new Promise(function(res){
    var t0=Date.now();
    (function tick(){
      var d=fb(); if(d) return res(d);
      if(Date.now()-t0>ms) return res(null);
      setTimeout(tick,300);
    })();
  });
}

/* The core publish, with no dialogs, so it can be chained for all 8 modules. */
function publishQuiet(){
  var m=metaRead(), src=$('src').value;
  var chapters=parse(src);
  if(!m.title || !chapters.length) return Promise.reject({code:'nothing-to-publish'});
  var id=bookId(m);
  var payload=JSON.stringify({meta:m, src:src, publishedAt:new Date().toISOString()});
  if(payload.length>DOC_LIMIT*0.9) return Promise.reject({code:'too-large'});
  var words=(src.match(/\S+/g)||[]).length;

  return waitForFb(9000).then(function(db){
    if(!db) return Promise.reject({code:'offline'});
    var stamp=firebase.firestore.FieldValue.serverTimestamp();
    return db.collection('sync').doc('alizonBook_'+id).set({value:payload, updatedAt:stamp})
      .then(function(){ return db.collection('sync').doc(IDX_DOC).get(); })
      .then(function(snap){
        var list=[];
        try{ list=JSON.parse((snap.exists&&snap.data().value)||'[]')||[]; }catch(e){ list=[]; }
        if(!Array.isArray(list)) list=[];
        var entry={id:id, module:m.module||'', title:m.title, sub:m.sub||'', prog:m.prog||'',
                   ed:m.ed||'', auth:m.auth||'', chapters:chapters.length, words:words,
                   kb:Math.round(payload.length/1024), at:new Date().toISOString()};
        var found=-1; list.forEach(function(x,i){ if(x && x.id===id) found=i; });
        if(found>=0) list[found]=entry; else list.push(entry);
        list.sort(function(a,b){ return (parseInt(a.module,10)||99)-(parseInt(b.module,10)||99); });
        return db.collection('sync').doc(IDX_DOC).set({value:JSON.stringify(list), updatedAt:stamp});
      });
  });
}

function publish(){
  var m=metaRead(), src=$('src').value;
  if(!m.title){ alert('Give the book a title before publishing.'); $('mTitle').focus(); return; }
  if(!src.trim()){ alert('There is nothing to publish yet.'); return; }
  var chapters=parse(src);
  if(!chapters.length){ alert('No units found. Add at least one @chapter before publishing.'); return; }
  var payload=JSON.stringify({meta:m, src:src});
  if(payload.length>DOC_LIMIT*0.9){
    alert('This book is '+Math.round(payload.length/1024)+' KB, too close to the 1 MB per-book limit.\n\n'
      +'Split it into two module books and bind them with Combine volume for printing.');
    return;
  }
  var words=(src.match(/\S+/g)||[]).length;
  if(!confirm('Publish "'+m.title+'" to the student library?\n\n'
    +chapters.length+' unit'+(chapters.length===1?'':'s')+' · '+words.toLocaleString()+' words · '
    +Math.round(payload.length/1024)+' KB\n\nStudents will see it immediately.')) return;

  $('stSaved').textContent='Publishing…';
  publishQuiet().then(function(){
    $('stSaved').textContent='Published '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    alert('Published. Students can read it now in the Library.');
  }).catch(function(e){
    $('stSaved').textContent='';
    alert('Publishing failed: '+((e&&e.code)||(e&&e.message)||'unknown')+'\n\nThe book is still saved on this device.');
  });
}

function unpublish(){
  waitForFb(9000).then(function(db){
    if(!db){ alert('Not connected to the cloud yet.'); return; }
    return db.collection('sync').doc(IDX_DOC).get().then(function(snap){
      var list=[];
      try{ list=JSON.parse((snap.exists&&snap.data().value)||'[]')||[]; }catch(e){}
      if(!list.length){ alert('Nothing is published yet.'); return; }
      var pick=prompt('Withdraw which book from the student library?\n\n'
        +list.map(function(x,i){ return (i+1)+'. '+(x.module?'M'+x.module+' · ':'')+x.title; }).join('\n'),'1');
      var n=parseInt(pick,10); if(!n||n<1||n>list.length) return;
      var gone=list[n-1];
      if(!confirm('Withdraw "'+gone.title+'"? Students will no longer see it.')) return;
      list.splice(n-1,1);
      var stamp=firebase.firestore.FieldValue.serverTimestamp();
      return db.collection('sync').doc('alizonBook_'+gone.id).delete()
        .then(function(){ return db.collection('sync').doc(IDX_DOC).set({value:JSON.stringify(list), updatedAt:stamp}); })
        .then(function(){ alert('Withdrawn from the student library.'); });
    });
  }).catch(function(e){ alert('Could not withdraw: '+((e&&e.code)||'unknown')); });
}

/* ============================================================
   UNIVERSAL IMPORT
   One entry point for "I already have the content somewhere".
   The format is detected rather than asked for, because the person
   with the content usually does not know or care what format it is in.
   Detection is shown before anything is inserted — a converter that
   guesses silently is worse than one that asks.
   ============================================================ */
function splitCsvLine(line, delim){
  var out=[], cur='', q=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(q){
      if(c==='"' && line[i+1]==='"'){ cur+='"'; i++; }
      else if(c==='"'){ q=false; }
      else cur+=c;
    } else {
      if(c==='"') q=true;
      else if(c===delim){ out.push(cur); cur=''; }
      else cur+=c;
    }
  }
  out.push(cur);
  return out.map(function(x){ return x.trim(); });
}

function detectFormat(text){
  var t=String(text||'').trim();
  if(!t) return {kind:'empty'};
  if(/^[\[{]/.test(t)){
    try{ var j=JSON.parse(t); if(j && (j.src || j.type==='alizon-textbook')) return {kind:'alizon-json', data:j}; }catch(e){}
  }
  if(/^@(chapter|section|objectives)\b/m.test(t)) return {kind:'already-markup'};

  /* CSV / TSV: consistent delimiter count across the first several lines */
  var lines=t.split('\n').filter(function(l){ return l.trim()!==''; }).slice(0,12);
  ['\t',',',';','|'].forEach||0;
  var best=null;
  ['\t',',',';'].forEach(function(d){
    var counts=lines.map(function(l){ return splitCsvLine(l,d).length; });
    var c0=counts[0];
    if(c0>=2 && counts.filter(function(c){ return c===c0; }).length >= Math.max(2, Math.ceil(counts.length*0.7))){
      if(!best || c0>best.cols) best={kind:'csv', delim:d, cols:c0};
    }
  });
  if(best) return best;

  if(/^#{1,4}\s+\S/m.test(t)) return {kind:'markdown'};
  return {kind:'prose'};
}

/* CSV → markup. Header names are matched loosely, because nobody names a
   column the way your parser expects. */
function csvToMarkup(text, delim){
  var rows=String(text).replace(/\r/g,'').split('\n').filter(function(l){ return l.trim()!==''; })
                       .map(function(l){ return splitCsvLine(l,delim); });
  if(!rows.length) return {markup:'', note:'empty'};

  var head=rows[0].map(function(h){ return h.toLowerCase().replace(/[^a-z]/g,''); });
  function find(){
    for(var a=0;a<arguments.length;a++){
      var want=arguments[a];
      for(var i=0;i<head.length;i++) if(head[i].indexOf(want)>=0) return i;
    }
    return -1;
  }
  var iUnit=find('unit','chapter','module'),
      iSec =find('section','topic','heading','subheading'),
      iType=find('type','kind','block'),
      iText=find('content','text','body','detail','description','matter'),
      iCap =find('caption','label');

  var hasHeader = (iUnit>=0 || iSec>=0 || iText>=0);
  var body = hasHeader ? rows.slice(1) : rows;
  if(!hasHeader){ iUnit=0; iText=1; }   /* two bare columns: unit, content */

  var out=[], lastUnit=null, lastSec=null, note=[];
  body.forEach(function(r){
    var unit = iUnit>=0 ? (r[iUnit]||'').trim() : '';
    var sec  = iSec >=0 ? (r[iSec] ||'').trim() : '';
    var type = iType>=0 ? (r[iType]||'').trim().toLowerCase() : '';
    var txt  = iText>=0 ? (r[iText]||'').trim() : '';
    var cap  = iCap >=0 ? (r[iCap] ||'').trim() : '';
    if(!unit && !sec && !txt) return;

    if(unit && unit!==lastUnit){ out.push('@chapter '+unit, ''); lastUnit=unit; lastSec=null; }
    if(sec && sec!==lastSec){ out.push('@section '+sec, ''); lastSec=sec; }
    if(!txt) return;

    var TYPE_MAP={objective:'objectives', objectives:'objectives', outcome:'objectives', outcomes:'objectives',
                  know:'know', didyouknow:'know', fact:'know', activity:'activity', task:'activity',
                  note:'note', caution:'caution', warning:'caution', summary:'summary',
                  keyterm:'keyterms', keyterms:'keyterms', glossary:'keyterms',
                  exercise:'exercise', question:'exercise', questions:'exercise',
                  quote:'quote', figure:'figure', diagram:'diagram', table:'table'};
    var key=TYPE_MAP[type.replace(/[^a-z]/g,'')];
    if(key==='exercise'){ out.push('@exercise Exercises', txt.split(/\s*\|\s*|\s*;\s*/).map(function(q){ return 'Q: '+q; }).join('\n'), ''); }
    else if(key==='figure'){ out.push('@figure '+(cap?('| '+cap):('| '+txt)), ''); }
    else if(key==='diagram'){ out.push('@diagram '+txt, ''); }
    else if(key==='table'){ out.push('@table '+(cap||''), txt.replace(/\s*;\s*/g,'\n'), ''); }
    else if(key==='objectives' || key==='summary'){
      /* a spreadsheet cell holds a list as "a;b;c" — turn it into real bullets */
      var items=txt.split(/\s*;\s*/).filter(Boolean);
      out.push('@'+key+(cap?' '+cap:''), items.map(function(x){ return '- '+x; }).join('\n'), '');
    }
    else if(key==='keyterms'){ out.push('@keyterms', txt.split(/\s*;\s*/).filter(Boolean).join('\n'), ''); }
    else if(key){ out.push('@'+key+(cap?' '+cap:''), txt, ''); }
    else out.push(txt, '');
  });
  if(!out.length) note.push('no rows produced content');
  return {markup:out.join('\n').replace(/\n{3,}/g,'\n\n'),
          note:'columns → '+[['unit',iUnit],['section',iSec],['type',iType],['content',iText],['caption',iCap]]
                 .filter(function(x){ return x[1]>=0; }).map(function(x){ return x[0]; }).join(', ')
               +(hasHeader?'':' (no header row recognised — used column 1 as unit, column 2 as content)')};
}

function markdownToMarkup(text){
  return String(text).replace(/\r/g,'').split('\n').map(function(l){
    var m=/^(#{1,4})\s+(.*)$/.exec(l);
    if(!m) return l;
    var d=m[1].length, t=m[2].trim();
    if(d===1) return '@chapter '+t;
    if(d===2) return '@section '+t;
    return '@subsection '+t;
  }).join('\n');
}

function showImport(){
  var html='<div class="ovbox"><h2>Import content</h2>'
    +'<p class="lead">Drop in a file or paste anything — a spreadsheet export, notes from a document, '
    +'markdown, or a book exported from this studio. The format is detected and shown to you before '
    +'anything is inserted.</p>'
    +'<div id="dropzone" style="border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;'
      +'color:#6b6560;font-size:13px;margin-bottom:12px;cursor:pointer">'
      +'<b>Choose a file</b> or drop it here<br><span style="font-size:11.5px;opacity:.8">.csv &middot; .tsv &middot; .txt &middot; .md &middot; .json</span></div>'
    +'<textarea id="impText" placeholder="…or paste your content here" spellcheck="false" '
      +'style="width:100%;height:180px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.6;'
      +'padding:11px;border:1px solid var(--line);border-radius:10px;resize:vertical"></textarea>'
    +'<div id="impInfo" style="margin-top:10px;font-size:12.5px;color:#6b6560;min-height:20px"></div>'
    +'<div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">'
      +'<button class="btn" id="impCancel" style="border-color:var(--line);color:#6b6560">Cancel</button>'
      +'<button class="btn" id="impGo" style="border-color:var(--crimson);color:var(--crimson)" disabled>Convert &amp; insert</button>'
    +'</div></div>';
  var ov=document.createElement('div'); ov.className='ov'; ov.innerHTML=html;
  document.body.appendChild(ov);
  function close(){ try{ document.body.removeChild(ov); }catch(e){} }

  var ta=ov.querySelector('#impText'), info=ov.querySelector('#impInfo'), go=ov.querySelector('#impGo');
  var dz=ov.querySelector('#dropzone');
  var pending=null;

  function analyse(){
    var t=ta.value;
    var d=detectFormat(t);
    pending=null; go.disabled=true;
    if(d.kind==='empty'){ info.textContent=''; return; }
    if(d.kind==='alizon-json'){
      pending={markup:d.data.src||'', meta:d.data.meta||null};
      info.innerHTML='Detected: <b>a book exported from this studio</b>'+(d.data.meta&&d.data.meta.title?' — “'+esc(d.data.meta.title)+'”':'')+'. Its details will be filled in too.';
    } else if(d.kind==='already-markup'){
      pending={markup:t};
      info.innerHTML='Detected: <b>Alizon markup</b> already. It will be inserted unchanged.';
    } else if(d.kind==='csv'){
      var r=csvToMarkup(t, d.delim);
      pending={markup:r.markup};
      var dn=d.delim==='\t'?'tab':(d.delim===','?'comma':'semicolon');
      info.innerHTML='Detected: <b>'+dn+'-separated table</b>, '+d.cols+' columns. '+esc(r.note)+'.';
    } else if(d.kind==='markdown'){
      pending={markup:markdownToMarkup(t)};
      info.innerHTML='Detected: <b>Markdown headings</b>. # becomes a unit, ## a section, ### a sub-section.';
    } else {
      pending={markup:t, smart:true};
      info.innerHTML='Detected: <b>plain text</b>. Smart import will look for headings, “Learning outcomes”, “Summary”, “Exercises” and the like.';
    }
    go.disabled=!(pending && (pending.markup||'').trim());
  }
  ta.addEventListener('input', analyse);

  function readFile(f){
    if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){ ta.value=String(fr.result||''); analyse(); };
    fr.readAsText(f);
  }
  dz.addEventListener('click', function(){
    var inp=document.createElement('input');
    inp.type='file'; inp.accept='.csv,.tsv,.txt,.md,.json,text/plain,text/csv,application/json';
    inp.addEventListener('change', function(){ readFile(inp.files && inp.files[0]); });
    inp.click();
  });
  ['dragenter','dragover'].forEach(function(ev){
    dz.addEventListener(ev, function(e){ e.preventDefault(); dz.style.borderColor='var(--crimson)'; });
  });
  ['dragleave','drop'].forEach(function(ev){
    dz.addEventListener(ev, function(e){ e.preventDefault(); dz.style.borderColor='var(--line)'; });
  });
  dz.addEventListener('drop', function(e){
    e.preventDefault();
    var f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    readFile(f);
  });

  ov.querySelector('#impCancel').addEventListener('click', close);
  ov.addEventListener('click', function(e){ if(e.target===ov) close(); });
  go.addEventListener('click', function(){
    if(!pending) return;
    if($('src').value.trim() && !confirm('Replace what is currently in the editor?')) return;
    if(pending.meta){
      var mm=pending.meta;
      if(mm.module) $('mModule').value=mm.module;
      if(mm.title)  $('mTitle').value=mm.title;
      if(mm.sub)    $('mSub').value=mm.sub;
      if(mm.prog)   $('mProg').value=mm.prog;
      if(mm.ed)     $('mEd').value=mm.ed;
      if(mm.auth)   $('mAuth').value=mm.auth;
    }
    $('src').value=pending.markup;
    $('mScope').setAttribute('data-sig','');
    close();
    if(pending.smart) smartImport(); else render();
  });
}

/* ---------- format guide ---------- */

    ['@section Title','A numbered section — 1.1, 1.2 … Appears in the contents.'],
    ['@subsection Title','A numbered sub-section — 1.1.1, 1.1.2 …'],
    ['@pagebreak','Force the next content onto a new page.']
  ]],
  ['Teaching boxes',[

    ['@know Heading','A “Did you know?” box — a memorable aside.'],
    ['@activity Heading','Something the student must go and do.'],
    ['@note','A clarification.'],
    ['@caution','A safety warning.'],
    ['@summary','“What we have learnt”, normally at the unit end.'],

    ['@table Caption','Follow it with rows using <code>|</code> between cells. The first row becomes the heading.'],

  ]],
  ['Writing text',[
    ['Plain lines','Ordinary paragraphs. A blank line starts a new one.'],

function showGuide(){
  var html='<div class="ovbox"><h2>The Alizon textbook format</h2>'
    +'<p class="lead">Type a line beginning with <code>@</code> to mark a block; everything else is ordinary text. '
    +'You never number anything yourself — units, sections, figures and tables are numbered as the book is built, '
    +'and the contents page takes its page numbers from the finished pages. '
    +'If you already have plain notes, paste them in and press <b>Smart import</b> to convert them. '
    +'Prefer <b>@diagram</b> over photographs where you can — a diagram costs about a kilobyte, stays sharp in print, '
    +'and adapts to night reading, while an embedded image costs hundreds of kilobytes against the 1 MB per-book limit.</p>';
  GUIDE.forEach(function(g){
    html+='<h3>'+esc(g[0])+'</h3><table class="gt">';
    g[1].forEach(function(r){ html+='<tr><td><code>'+esc(r[0])+'</code></td><td>'+r[1]+'</td></tr>'; });
    html+='</table>';
  });
  html+='<div style="margin-top:22px;text-align:right"><button class="btn" id="gClose" style="border-color:var(--crimson);color:var(--crimson)">Close</button></div></div>';
  var ov=document.createElement('div'); ov.className='ov'; ov.innerHTML=html;
  document.body.appendChild(ov);
  function close(){ try{ document.body.removeChild(ov); }catch(e){} }
  ov.querySelector('#gClose').addEventListener('click', close);
  ov.addEventListener('click', function(e){ if(e.target===ov) close(); });
  document.addEventListener('keydown', function k(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',k); } });
}

/* Books load on demand — the full texts are far too large to ship on every page
   load, so this mirrors how the exam banks are fetched. */
function loadStarter(n){
  return AlizonBooks.load(n).then(function(b){
    $('mModule').value=b.meta.module; $('mTitle').value=b.meta.title; $('mSub').value=b.meta.sub;
    $('mProg').value=b.meta.prog; $('mEd').value=b.meta.ed; $('mAuth').value=b.meta.auth;
    $('src').value=b.src;
    $('mScope').setAttribute('data-sig','');   /* force the unit list to rebuild */
    render();
    return true;
  });
}
/* ---------- whole programme in one stretch ----------
   All 32 units concatenated into a single volume. Unit titles are prefixed with
   the module so the contents page stays readable once the chapters run 1-32,
   and the scope selector can then isolate any single unit out of the whole set. */
function loadWholeProgramme(){
  return AlizonBooks.loadAll().then(function(all){
    var nums=Object.keys(all).map(Number).sort(function(a,b){return a-b;});
    if(!nums.length) return Promise.reject(new Error('no books could be loaded'));
    var parts=[], missing=[];
    for(var n=1;n<=8;n++){ if(!all[n]) missing.push(n); }
    nums.forEach(function(n){
      var b=all[n];
      /* retitle each unit so it carries its module once the numbering is continuous */
      var src=String(b.src||'').replace(/^@chapter\s+(.*)$/gm, function(_,t){
        return '@chapter Module '+n+' · '+t;
      });
      parts.push(src.replace(/\s+$/,''));
    });
    $('mModule').value='';
    $('mTitle').value='Certificate Course in Digital Health & Artificial Intelligence for Pharmacy — Complete Programme';
    $('mSub').value='All eight modules, thirty-two units';
    $('mProg').value='Certificate Course in Digital Health & Artificial Intelligence for Pharmacy';
    $('mEd').value='First Edition · 2026';
    $('mAuth').value='Alizon School of Medical & Digital Intelligence';
    $('src').value=parts.join('\n\n');
    $('mScope').setAttribute('data-sig','');
    render();
    return {loaded:nums.length, missing:missing};
  });
}
$('btnWhole').addEventListener('click', function(){
  if($('src').value.trim() && !confirm('Replace what is in the editor with the complete programme?')) return;
  $('stSaved').textContent='Loading all 8 modules…';
  loadWholeProgramme().then(function(r){
    $('stSaved').textContent='Whole programme loaded';
    if(r.missing.length) alert('Loaded '+r.loaded+' of 8 modules.\n\nCould not load: '+r.missing.join(', '));
  }).catch(function(e){
    $('stSaved').textContent='';
    alert('Could not load the programme: '+e.message);
  });
});

$('btnStarter').addEventListener('click', function(){
  if($('src').value.trim() && !confirm('Replace what is in the editor?')) return;
  var n=prompt('Load the starter textbook for which module? (1-8)', $('mModule').value||'1');
  n=parseInt(n,10); if(!n||n<1||n>8) return;
  loadStarter(n);
});
$('btnPubAll').addEventListener('click', function(){
  if(!confirm('Publish the textbooks for all 8 modules to the student library?\n\n'
    +'Anything already published under the same module number is replaced.')) return;
  var done=[], failed=[];
  var chain=Promise.resolve();
  for(var n=1;n<=8;n++){
    (function(k){
      chain=chain.then(function(){
        /* loadStarter is async now — the book must arrive before it is published,
           or the same editor contents would be published eight times. */
        $('stSaved').textContent='Publishing module '+k+'\u2026';
        return loadStarter(k)
          .then(function(){ return publishQuiet(); })
          .then(function(){ done.push(k); })
          .catch(function(e){ failed.push(k+' ('+((e&&e.code)||(e&&e.message)||'error')+')'); });
      });
    })(n);
  }
  chain.then(function(){
    alert('Published '+done.length+' of 8.'+(failed.length?'\n\nFailed: '+failed.join(', '):''));
    $('stSaved').textContent='Published modules '+done.join(', ');
  });
});
$('btnImport').addEventListener('click', showImport);
$('btnGuide').addEventListener('click', showGuide);
$('btnSmart').addEventListener('click', smartImport);
$('btnSave').addEventListener('click', save);
$('btnOpen').addEventListener('click', open_);
$('btnExport').addEventListener('click', exportJson);
$('btnCombine').addEventListener('click', combine);

$('btnPublish').addEventListener('click', function(e){ if(e.shiftKey) unpublish(); else publish(); });
$('btnPublish').title='Publish this book to the student Library. Shift-click to withdraw a published book.';
$('btnPrint').addEventListener('click', function(){ render(); setTimeout(function(){ window.print(); }, 120); });

render();
})();
