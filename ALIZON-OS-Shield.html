<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-title" content="Shield">
<meta name="robots" content="index, follow">
<meta name="description" content="ALIZON Shield — a free, private malware scanner that runs entirely in your browser. Drop in files, an archive or a whole folder: it identifies the true file type, computes SHA-256, parses Windows executables, Office documents, PDFs and archives, and explains every finding in plain language. Nothing is ever uploaded.">
<title>ALIZON Shield — Free Browser-Based Malware Scanner | Alizon</title>
<link rel="icon" href="alizon-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* A security tool should look like one: graphite chrome, a white working
     surface, and a verdict palette that never relies on colour alone — every
     status carries a glyph and a word as well as a hue, so it survives being
     printed, projected, or read by somebody who cannot separate red from
     amber. Deliberately distinct from PV Lab's navy/teal and from the
     institution's cardinal, because this is a different kind of application. */
  :root{
    --shell:#0B1220; --shell-2:#131C2E; --shell-3:#1E293B;
    --brand:#059669; --brand-2:#10B981; --brand-soft:#D1FAE5;
    --red:#B91C1C;   --red-soft:#FEE2E2;  --red-line:#FECACA;
    --amber:#B45309; --amber-soft:#FEF3C7;--amber-line:#FDE68A;
    --sky:#0369A1;   --sky-soft:#E0F2FE;  --sky-line:#BAE6FD;
    --green:#15803D; --green-soft:#DCFCE7;--green-line:#BBF7D0;
    --violet:#6D28D9;--violet-soft:#EDE9FE;
    --ink:#0F172A; --muted:#64748B; --faint:#94A3B8;
    --bg:#F1F5F9; --panel:#FFFFFF; --panel-2:#F8FAFC; --line:#E2E8F0; --line-2:#CBD5E1;
    --radius:10px;
    --shadow:0 1px 2px rgba(15,23,42,.06), 0 4px 12px -6px rgba(15,23,42,.10);
    --shadow-lg:0 20px 50px -18px rgba(15,23,42,.35);
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sidebar:250px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);
    color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.55}
  a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
  button,input,select,textarea{font:inherit;color:inherit}
  code{font-family:var(--mono);font-size:.86em;background:var(--panel-2);border:1px solid var(--line);
    padding:1px 5px;border-radius:4px;word-break:break-all}
  .muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .sp{margin-left:auto}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
  .side{background:var(--shell);color:#CBD5E1;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;overflow-y:auto}
  .side .brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
  .side .brand .nm{color:#fff;font-weight:800;font-size:16.5px;letter-spacing:-.01em;
    display:flex;align-items:center;gap:9px}
  .side .brand .nm svg{width:20px;height:20px;flex:none;color:var(--brand-2)}
  .side .brand .sb{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#6EE7B7;
    margin-top:6px;font-weight:700}
  .side nav{padding:12px 0;flex:1}
  .side .nv{display:flex;align-items:center;gap:11px;padding:9px 18px;color:#CBD5E1;font-size:13.4px;
    font-weight:500;border-left:3px solid transparent}
  .side .nv:hover{background:rgba(255,255,255,.05);color:#fff;text-decoration:none}
  .side .nv.on{background:rgba(5,150,105,.20);color:#fff;border-left-color:var(--brand-2);font-weight:600}
  .side .nv .ic{width:16px;text-align:center;flex:none;opacity:.85;font-size:13px}
  .side .nv .ct{margin-left:auto;background:rgba(255,255,255,.14);border-radius:100px;padding:1px 7px;
    font-size:10.5px;font-weight:700}
  .side .foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;
    color:#64748B;line-height:1.6}
  .side .foot a{color:#94A3B8}
  .side .privacy{margin:0 14px 14px;background:rgba(5,150,105,.14);border:1px solid rgba(16,185,129,.28);
    border-radius:8px;padding:10px 12px;font-size:11px;line-height:1.55;color:#A7F3D0}
  .side .privacy b{color:#6EE7B7;display:block;margin-bottom:3px;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase}

  .main{display:flex;flex-direction:column;min-width:0}
  .top{background:var(--panel);border-bottom:1px solid var(--line);padding:0 24px;height:62px;
    display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:40}
  .top h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .top .crumb{font-size:12px;color:var(--muted)}
  .body{padding:22px 24px 80px;flex:1;min-width:0}
  .burger{display:none;place-items:center;border:1px solid var(--line);background:var(--panel);
    border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:15px}

  /* ---------- primitives ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card .hd{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .card .hd h2{font-size:14.5px;font-weight:700}
  .card .bd{padding:18px} .card .bd.tight{padding:0}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

  .btn{border:1px solid transparent;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;
    cursor:pointer;background:var(--brand);color:#fff;white-space:nowrap}
  .btn:hover{background:var(--brand-2)}
  .btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line-2)}
  .btn.sec:hover{background:var(--panel-2);border-color:var(--faint)}
  .btn.dgr{background:var(--red)} .btn.dgr:hover{filter:brightness(1.12)}
  .btn.sm{padding:6px 12px;font-size:12.2px}
  select.mini{border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font-size:12.2px;
    background:var(--panel);cursor:pointer}
  textarea{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;
    font-family:var(--mono);font-size:12px;resize:vertical;background:var(--panel-2)}
  textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);background:#fff}

  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{background:var(--panel-2);text-align:left;padding:10px 14px;font-size:10.5px;font-weight:700;
    color:var(--muted);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.clk{cursor:pointer} tbody tr.clk:hover td{background:var(--panel-2)}
  .tw{overflow-x:auto}
  .fn{font-weight:600;word-break:break-all}
  .fp{font-size:11.2px;color:var(--muted);word-break:break-all;margin-top:2px}
  .fnd{font-weight:500}
  table.mini-t{font-size:12.2px} table.mini-t td{padding:7px 10px} table.mini-t th{padding:7px 10px}
  .hot{color:var(--red);font-weight:700}

  /* ---------- verdict badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:6px;border-radius:100px;padding:3px 11px 3px 4px;
    font-size:11.2px;font-weight:700;white-space:nowrap}
  /* The glyph sits in a filled disc. Its background cannot use currentColor:
     the disc sets its own colour to white for the glyph, and currentColor
     resolves against that, which paints white on white. Set it per verdict. */
  .badge .mk{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;
    color:#fff;font-size:10px;font-weight:700;line-height:1;flex:none}
  .v-mal{background:var(--red-soft);color:var(--red)}
  .v-mal .mk{background:var(--red)}
  .v-susp{background:var(--amber-soft);color:var(--amber)}
  .v-susp .mk{background:var(--amber)}
  .v-low{background:var(--sky-soft);color:var(--sky)}
  .v-low .mk{background:var(--sky)}
  .v-clean{background:var(--green-soft);color:var(--green)}
  .v-clean .mk{background:var(--green)}
  .v-uns{background:var(--violet-soft);color:var(--violet)}
  .v-uns .mk{background:var(--violet)}

  /* ---------- stat tiles ---------- */
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .stat .lb{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .stat .vl{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1;
    font-variant-numeric:tabular-nums}
  .stat .sub{font-size:11.2px;color:var(--muted);margin-top:4px}
  .acc-red{border-top:3px solid var(--red)}    .acc-amber{border-top:3px solid var(--amber)}
  .acc-sky{border-top:3px solid var(--sky)}    .acc-green{border-top:3px solid var(--green)}
  .acc-slate{border-top:3px solid var(--shell-3)}

  /* ---------- drop zone ---------- */
  .drop{background:var(--panel);border:2px dashed var(--line-2);border-radius:14px;padding:44px 24px;
    text-align:center;transition:.18s}
  .drop .dz-ic{font-size:34px;color:var(--brand);opacity:.6;line-height:1}
  .drop h2{font-size:19px;font-weight:700;margin:12px 0 6px}
  .drop p{color:var(--muted);max-width:56ch;margin:0 auto;font-size:13.2px}
  body.dragging .drop{border-color:var(--brand);background:var(--brand-soft)}
  body.dragging::after{content:"Drop to scan";position:fixed;inset:0;z-index:90;display:grid;place-items:center;
    background:rgba(5,150,105,.10);border:3px dashed var(--brand);color:var(--brand);font-size:24px;
    font-weight:800;pointer-events:none;backdrop-filter:blur(1px)}
  .chk-line{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:12.2px;color:var(--muted);
    cursor:pointer}
  .chk-line input{flex:none}
  /* The global break-all would split these chips mid-word on a phone. */
  .chk-line code{font-size:11px;white-space:nowrap;word-break:keep-all}
  .chk-hint{font-size:11.4px;color:var(--faint);margin-top:6px}
  .chk-hint code{font-size:10.8px;white-space:nowrap;word-break:keep-all}

  /* ---------- progress ---------- */
  .scanning{border-color:var(--brand)}
  .pg{height:8px;background:var(--panel-2);border-radius:100px;overflow:hidden;margin-top:12px;
    border:1px solid var(--line)}
  .pg i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));
    border-radius:100px;transition:width .2s;width:0}
  .pgl{font-size:11.5px;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums}

  /* ---------- notes ---------- */
  .note{border-radius:8px;padding:12px 15px;font-size:12.8px;line-height:1.65;border:1px solid}
  .note .t{font-weight:700;display:block;margin-bottom:3px}
  .note.info{background:var(--sky-soft);border-color:var(--sky-line);color:#0C4A6E}
  .note.ok{background:var(--green-soft);border-color:var(--green-line);color:#14532D}
  .note.warn{background:var(--amber-soft);border-color:var(--amber-line);color:#78350F}
  .note.bad{background:var(--red-soft);border-color:var(--red-line);color:#7F1D1D}
  .note a{color:inherit;text-decoration:underline}
  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
  .empty h3{font-size:15px;color:var(--ink);margin-bottom:5px}
  .hint{font-size:11.8px;color:var(--muted);line-height:1.6;margin-top:8px}

  /* ---------- key/value ---------- */
  .kv{display:grid;grid-template-columns:minmax(120px,32%) 1fr;gap:8px 14px;font-size:13px;margin-top:4px}
  .kv .k{color:var(--muted);font-weight:600}
  .kv .v{word-break:break-word}

  /* ---------- detail drawer ---------- */
  .drawer{position:fixed;inset:0;z-index:70;pointer-events:none}
  .drawer .scr{position:absolute;inset:0;background:rgba(15,23,42,.42);opacity:0;transition:.22s}
  .drawer .pn{position:absolute;right:0;top:0;bottom:0;width:min(680px,100vw);background:var(--panel);
    box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .24s;
    display:flex;flex-direction:column}
  .drawer.on{pointer-events:auto}
  .drawer.on .scr{opacity:1} .drawer.on .pn{transform:none}
  .drawer .dh-bar{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;
    gap:12px;flex-wrap:wrap}
  .drawer .drname{font-weight:700;font-size:14.5px;word-break:break-all}
  .drawer .dbody{padding:20px;overflow-y:auto;flex:1}
  .dh{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .x{border:1px solid var(--line);background:var(--panel);border-radius:7px;width:30px;height:30px;
    cursor:pointer;font-size:15px;color:var(--muted);flex:none}
  .x:hover{background:var(--panel-2);color:var(--ink)}

  .hashes{display:grid;gap:6px}
  .hrow{display:flex;align-items:center;gap:9px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:7px;padding:7px 9px}
  .hrow .hl{font-size:10px;font-weight:800;letter-spacing:.07em;color:var(--muted);width:58px;flex:none}
  .hrow .hv{font-size:11px;flex:1;background:none;border:none;padding:0}
  .copy{border:1px solid var(--line-2);background:var(--panel);border-radius:5px;width:24px;height:24px;
    cursor:pointer;font-size:11px;color:var(--muted);flex:none}
  .copy:hover{color:var(--brand);border-color:var(--brand)}

  .find{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:11px 13px;margin-bottom:9px;
    background:var(--panel-2)}
  .find .fh{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .find .fh b{font-size:13.4px}
  .find .sev{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    padding:2px 7px;border-radius:100px;flex:none}
  .find .cnt{font-size:11px;color:var(--muted);font-weight:700}
  .find .fd{margin-top:7px} .find .fd code{font-size:11.2px;background:#fff}
  .find .fw{margin-top:7px;font-size:12.4px;line-height:1.62;color:#334155}
  .s-crit{border-left-color:var(--red)}    .s-crit .sev{background:var(--red-soft);color:var(--red)}
  .s-high{border-left-color:#DC2626}       .s-high .sev{background:var(--red-soft);color:#DC2626}
  .s-med{border-left-color:var(--amber)}   .s-med .sev{background:var(--amber-soft);color:var(--amber)}
  .s-low{border-left-color:var(--sky)}     .s-low .sev{background:var(--sky-soft);color:var(--sky)}
  .s-info{border-left-color:var(--line-2)} .s-info .sev{background:var(--panel-2);color:var(--muted)}

  .nest{border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:9px;background:var(--panel-2)}
  .nest b{font-size:13px;word-break:break-all}
  .nest .muted{font-size:11.5px}
  .nf{font-size:12.2px;margin-top:6px;display:flex;align-items:center;gap:7px}
  .nf .sev{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;
    border-radius:100px}

  .names{margin-top:10px;font-size:12.2px}
  .names summary{cursor:pointer;color:var(--brand);font-weight:600;padding:4px 0}
  .names ul{list-style:none;margin-top:6px;max-height:240px;overflow-y:auto;border:1px solid var(--line);
    border-radius:7px;padding:8px}
  .names li{padding:2px 0} .names code{font-size:11px;background:none;border:none;padding:0}

  .qz{margin-top:24px;border:1px solid var(--red-line);background:var(--red-soft);border-radius:9px;padding:14px}
  .qz b{color:var(--red);font-size:13.4px}
  .qz p{font-size:12.4px;color:#7F1D1D;margin:6px 0 11px;line-height:1.6}
  .qlist{list-style:none;max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:7px;
    padding:9px;margin:10px 0;font-size:12px}
  .qlist li{padding:2px 0}

  /* ---------- modal ---------- */
  .mw{position:fixed;inset:0;z-index:85;display:none}
  .mw.on{display:block}
  .mw .sc{position:absolute;inset:0;background:rgba(15,23,42,.5)}
  .mw .md{position:relative;margin:8vh auto;max-width:600px;background:var(--panel);border-radius:12px;
    box-shadow:var(--shadow-lg);max-height:84vh;display:flex;flex-direction:column}
  .mw .mh{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .mw .mh h3{font-size:15px;font-weight:700;flex:1}
  .mw .mb{padding:20px;overflow-y:auto;font-size:13.4px;line-height:1.65}
  .mw .mb p+p{margin-top:10px}
  .mw .mf{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}

  /* ---------- prose ---------- */
  .prose{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:28px 32px;max-width:860px}
  .prose h2{font-size:20px;font-weight:700;margin-bottom:10px;letter-spacing:-.01em}
  .prose h3{font-size:14.5px;font-weight:700;margin:26px 0 8px}
  .prose h3.warn-h{color:var(--amber)}
  .prose p{margin-bottom:11px;color:#334155}
  .prose ul,.prose ol{margin:0 0 12px 20px;color:#334155}
  .prose li{margin-bottom:8px}
  .prose .steps-list li{margin-bottom:11px}
  .prose b{color:var(--ink)}

  @media(max-width:1000px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);z-index:75;transform:translateX(-100%);
      transition:transform .22s}
    .side.open{transform:none}
    .scrim{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:72;display:none}
    .scrim.on{display:block}
    .burger{display:grid}
  }
  @media(max-width:640px){
    .body{padding:16px 14px 70px} .top{padding:0 14px;gap:10px}
    .drop{padding:32px 16px} .prose{padding:20px 18px}
    .kv{grid-template-columns:1fr;gap:2px 0}
    .kv .k{margin-top:8px}
    .drawer .dbody{padding:16px 14px}
  }
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>

<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="nm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2 4 5.5v6c0 5 3.4 9.3 8 10.5 4.6-1.2 8-5.5 8-10.5v-6L12 2Z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        ALIZON Shield
      </div>
      <div class="sb">Malware Scanner</div>
    </div>
    <nav id="nav"></nav>
    <div class="privacy">
      <b>Private by construction</b>
      Files are read and analysed on this device. Nothing is uploaded — there is no server to upload to.
    </div>
    <div class="foot">
      Free to use. No account, no licence key, no telemetry.<br><br>
      Alizon School of Medical &amp; Digital Intelligence<br>
      <a href="alizon-os.html">ALIZON AOS →</a>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="burger" id="burger" aria-label="Menu">&#9776;</button>
      <div>
        <h1 id="ttl">Scan</h1>
        <div class="crumb" id="crumb"></div>
      </div>
    </header>
    <div class="body" id="view"></div>
  </div>
</div>

<div class="drawer" id="drawer">
  <div class="scr" id="drScrim"></div>
  <div class="pn">
    <div class="dh-bar">
      <div id="drTitle" style="flex:1"></div>
      <button class="x" id="drClose" aria-label="Close">&times;</button>
    </div>
    <div class="dbody" id="drBody"></div>
  </div>
</div>

<div class="mw" id="modal">
  <div class="sc" id="modalSc"></div>
  <div class="md">
    <div class="mh"><h3 id="modalT">—</h3><button class="x" id="modalX" aria-label="Close">&times;</button></div>
    <div class="mb" id="modalB"></div>
    <div class="mf" id="modalF"></div>
  </div>
</div>

<script src="shield-signatures.js?v=1"></script>
