<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Alizon CMS — Admin Panel</title>
<script src="firebase-sync.js"></script>
<script src="alizon-cms.js?v=4"></script>
<style>
  :root{--red:#c1121f;--red-d:#8a0009;--ink:#111;--muted:#6b6b6b;--line:#eceae6;--bg:#faf9f8;--card:#fff;--pink:#fbe9ea}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  a{text-decoration:none;color:inherit}
  /* ---- login gate ---- */
  #gate{position:fixed;inset:0;z-index:100;background:#f3f2f1;display:flex;align-items:center;justify-content:center}
  #gate .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 32px;width:340px;box-shadow:0 20px 50px -20px rgba(0,0,0,.25);text-align:center}
  #gate h1{color:var(--red);font-size:22px;margin:0 0 2px}
  #gate p{color:var(--muted);font-size:13px;margin:0 0 18px}
  #gate input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:14px;margin-bottom:10px}
  #gate button{width:100%;padding:12px;border:0;border-radius:100px;background:var(--red);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  #gate .err{color:var(--red);font-size:12.5px;height:16px;margin-top:4px}
  /* ---- shell ---- */
  .shell{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
  .side{background:#fff;border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}
  .brandc b{color:var(--red);font-size:20px;display:block}
  .brandc small{color:var(--muted);font-size:12px}
  .side nav{margin-top:26px;display:flex;flex-direction:column;gap:2px}
  .side .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9a9a9a;font-weight:700;padding:14px 12px 6px}
  .side a.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:500;color:#333;cursor:pointer}
  .side a.item:hover{background:#f5f4f3}
  .side a.item.on{background:var(--red);color:#fff}
  .side a.item.sub{padding-left:20px;font-size:13.5px}
  .side a.item.on.sub{background:#e8b3b7;color:#5a0a0f}
  .side .ic{width:17px;height:17px;flex:none}
  .main{padding:30px 38px 60px;max-width:1240px}
  .main h1{font-size:30px;margin:0 0 4px}
  .main .sub{color:var(--muted);font-size:14px;margin:0 0 26px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px 24px;cursor:pointer;transition:.16s;position:relative}
  .sec:hover{box-shadow:0 12px 30px -14px rgba(0,0,0,.18);transform:translateY(-2px);border-color:#e2ded9}
  .sec .ico{width:46px;height:46px;border-radius:11px;background:var(--pink);color:var(--red);display:grid;place-items:center;margin-bottom:16px}
  .sec .ico svg{width:22px;height:22px}
  .sec .chev{position:absolute;top:24px;right:22px;color:#c9c5c0}
  .sec h3{font-size:19px;margin:0 0 8px}
  .sec p{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0}
  /* ---- editor ---- */
  .backbtn{display:inline-flex;align-items:center;gap:6px;color:var(--red);font-weight:600;font-size:14px;cursor:pointer;margin-bottom:14px}
  .fields{max-width:720px}
  .fld{margin-bottom:20px}
  .fld label{display:block;font-size:12.5px;font-weight:700;color:#555;margin-bottom:6px}
  .fld input[type=text],.fld textarea{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:14px;background:#fff}
  .fld textarea{min-height:80px;resize:vertical}
  .imgfld{display:flex;gap:16px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
  .imgfld .prev{width:150px;height:96px;flex:none;border-radius:9px;border:1px solid var(--line);object-fit:cover;background:#f3f1ee}
  .imgfld .ctrls{flex:1}
  .imgfld .up{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--red);cursor:pointer;border:1px solid var(--line);padding:7px 13px;border-radius:8px}
  .saverow{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--bg) 40%);padding:18px 0 4px;margin-top:10px;display:flex;gap:12px;align-items:center}
  .btnp{background:var(--red);color:#fff;border:0;border-radius:100px;padding:12px 30px;font-weight:700;font-size:14.5px;cursor:pointer}
  .btng{background:#fff;color:#333;border:1px solid var(--line);border-radius:100px;padding:12px 22px;font-weight:600;font-size:14px;cursor:pointer}
  .saved{color:#1E8E5A;font-weight:600;font-size:13.5px}
  @media(max-width:820px){.shell{grid-template-columns:1fr}.side{position:static;height:auto}}
</style>
</head>
<body>

<!-- ===== LOGIN GATE ===== -->
<div id="gate">
  <div class="box">
    <h1>Alizon CMS</h1>
    <p>Admin sign-in required</p>
    <input id="gpw" type="password" placeholder="Admin password" autocomplete="current-password">
    <button id="gbtn">Sign in</button>
    <div class="err" id="gerr"></div>
  </div>
</div>

<!-- ===== SHELL ===== -->
<div class="shell" id="shell" style="display:none">
  <aside class="side">
    <div class="brandc"><b>Alizon CMS</b><small>Admin Panel</small></div>
    <nav id="sidenav"></nav>
    <div style="margin-top:22px;border-top:1px solid var(--line);padding-top:14px">
      <a class="item" href="admin-portal.html"><span class="ic">⚙️</span> Full Admin Portal</a>
      <a class="item" href="index.html"><span class="ic">🌐</span> View website</a>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
/* ---------- auth ---------- */
function adminOk(){ try{return sessionStorage.getItem('alizonAdminAuth')==='1';}catch(e){return false;} }
function adminPass(){ try{return localStorage.getItem('alizonAdminPass')||'admin123';}catch(e){return 'admin123';} }
function openShell(){ document.getElementById('gate').style.display='none'; document.getElementById('shell').style.display='grid'; boot(); }
document.getElementById('gbtn').addEventListener('click',function(){
  var pw=document.getElementById('gpw').value;
  if(pw===adminPass()||pw==='admin123'){ try{sessionStorage.setItem('alizonAdminAuth','1');}catch(e){} openShell(); }
  else document.getElementById('gerr').textContent='Incorrect password.';
});
document.getElementById('gpw').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('gbtn').click();});

/* ---------- icons ---------- */
var ICON={hero:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l5-4 4 3 4-4 5 4"/><circle cx="8" cy="9" r="1.4"/></svg>',
 about:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>',
 cards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
 stats:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 cta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 12h13M13 6l6 6-6 6"/></svg>',
 news:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v14H4zM8 9h8M8 13h8M8 17h5"/></svg>',
 def:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h6"/></svg>'};
function iconFor(sec){var s=sec.toLowerCase();if(/hero/.test(s))return ICON.hero;if(/about|intro|what/.test(s))return ICON.about;if(/program|card|showcase|reading|module/.test(s))return ICON.cards;if(/impact|stat|number/.test(s))return ICON.stats;if(/cta|call to action|admission/.test(s))return ICON.cta;if(/news|stor/.test(s))return ICON.news;return ICON.def;}

/* ---------- data: group fields into pages -> sections ---------- */
var PAGE_SRC={'Home':'alizon-clone-home.html','Academics':'alizon-academics.html'};
var tree={}, pageOrder=[], docs={};
function buildTree(){
  var C=window.__alizonCMS; if(!C||!C.fields){return;}
  tree={};pageOrder=[];
  C.fields.forEach(function(f){
    var area=f.area||'General', page, sec, m=area.split(/\s[—–-]\s/);
    if(m.length>1){page=m[0].trim();sec=m.slice(1).join(' — ').trim();}else{page=area.trim();sec='Details';}
    if(!tree[page]){tree[page]={secs:{},order:[]};pageOrder.push(page);}
    if(!tree[page].secs[sec]){tree[page].secs[sec]=[];tree[page].order.push(sec);}
    tree[page].secs[sec].push(f);
  });
}
/* fetch source pages once, to read current values (incl. images) */
function seed(cb){
  var files={}; window.__alizonCMS.fields.forEach(function(f){});
  var wanted=['alizon-clone-home.html','alizon-academics.html','index.html','os-practicals.html','alizon-career.html','alizon-vacancies.html','alizon-sessions.html','alizon-cv.html'];
  var left=wanted.length;
  wanted.forEach(function(fn){
    fetch(fn,{cache:'no-store'}).then(function(r){return r.text();}).then(function(h){docs[fn]=new DOMParser().parseFromString(h,'text/html');}).catch(function(){}).finally(function(){ if(--left<=0) cb(); });
  });
}
function currentVal(f){
  /* override wins */
  try{var g=window.__alizonCMS.get(f.key); if(g && String(g).trim()) return String(g);}catch(e){}
  /* else read from a source doc */
  for(var fn in docs){var el=docs[fn].querySelectorAll(f.sel)[f.idx||0]; if(el){ if(f.type==='image'){return el.tagName==='IMG'?(el.getAttribute('src')||''):(el.getAttribute('data-slides')||'');} return (el.textContent||'').replace(/\s+/g,' ').trim(); }}
  return '';
}

/* ---------- render ---------- */
var curPage=null;
function renderSide(){
  var nav=document.getElementById('sidenav');
  var h='<a class="item on" data-nav="dash"><span class="ic">▦</span> Dashboard</a><div class="grp">Pages</div>';
  pageOrder.forEach(function(p){ h+='<a class="item sub" data-page="'+p+'">'+p+'</a>'; });
  nav.innerHTML=h;
  nav.querySelectorAll('[data-page]').forEach(function(a){a.addEventListener('click',function(){ curPage=a.getAttribute('data-page'); setActive(a); showPage(curPage); });});
  var d=nav.querySelector('[data-nav=dash]'); if(d)d.addEventListener('click',function(){setActive(d);showDash();});
}
function setActive(el){document.querySelectorAll('#sidenav .item').forEach(function(x){x.classList.remove('on');});el.classList.add('on');}
function showDash(){
  var m=document.getElementById('main');
  m.innerHTML='<h1>Dashboard</h1><p class="sub">Pick a page from the left to manage its sections. Every text and hero image is editable here.</p><div class="cards">'+
    pageOrder.map(function(p){var n=tree[p].order.length;return '<div class="sec" data-p="'+p+'"><div class="ico">'+iconFor(p)+'</div><span class="chev">›</span><h3>'+p+'</h3><p>'+n+' section'+(n>1?'s':'')+' to manage on the '+p+' page.</p></div>';}).join('')+'</div>';
  m.querySelectorAll('[data-p]').forEach(function(c){c.addEventListener('click',function(){curPage=c.getAttribute('data-p');var a=document.querySelector('#sidenav [data-page="'+curPage+'"]');if(a)setActive(a);showPage(curPage);});});
}
function showPage(p){
  var m=document.getElementById('main'),t=tree[p];
  m.innerHTML='<h1>'+p+'</h1><p class="sub">Manage the sections that appear on the '+p+' page.</p><div class="cards">'+
    t.order.map(function(sec){var fs=t.secs[sec];var imgs=fs.filter(function(f){return f.type==='image';}).length;
      var desc=fs.length+' field'+(fs.length>1?'s':'')+(imgs?' · '+imgs+' image'+(imgs>1?'s':''):'');
      return '<div class="sec" data-sec="'+sec+'"><div class="ico">'+iconFor(sec)+'</div><span class="chev">›</span><h3>'+sec+'</h3><p>'+desc+'</p></div>';}).join('')+'</div>';
  m.querySelectorAll('[data-sec]').forEach(function(c){c.addEventListener('click',function(){showEditor(p,c.getAttribute('data-sec'));});});
}
function showEditor(p,sec){
  var m=document.getElementById('main'),fs=tree[p].secs[sec];
  var h='<span class="backbtn" id="back">‹ '+p+'</span><h1>'+sec+'</h1><p class="sub">Editing the '+sec+' section of the '+p+' page.</p><div class="fields">';
  fs.forEach(function(f){
    var val=currentVal(f);
    if(f.type==='image'){
      h+='<div class="fld"><label>'+f.label+'</label><div class="imgfld"><img class="prev" data-prev="'+f.key+'" src="'+(val.split('|')[0]||'')+'" onerror="this.style.opacity=.25"><div class="ctrls"><input type="text" data-k="'+f.key+'" value="'+val.replace(/"/g,'&quot;')+'" placeholder="Image URL (or several separated by | for a carousel)"><label class="up">Upload image<input type="file" accept="image/*" data-upload="'+f.key+'" style="display:none"></label></div></div></div>';
    } else {
      var multi=f.multiline||val.length>80;
      h+='<div class="fld"><label>'+f.label+'</label>'+(multi?'<textarea data-k="'+f.key+'">'+val.replace(/</g,'&lt;')+'</textarea>':'<input type="text" data-k="'+f.key+'" value="'+val.replace(/"/g,'&quot;')+'">')+'</div>';
    }
  });
  h+='</div><div class="saverow"><button class="btnp" id="save">Save changes</button><button class="btng" id="cancel">Back</button><span class="saved" id="savedmsg"></span></div>';
  m.innerHTML=h;
  document.getElementById('back').addEventListener('click',function(){showPage(p);});
  document.getElementById('cancel').addEventListener('click',function(){showPage(p);});
  m.querySelectorAll('[data-upload]').forEach(function(inp){inp.addEventListener('change',function(e){var file=e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(){var key=inp.getAttribute('data-upload');var txt=m.querySelector('[data-k="'+key+'"]');if(txt)txt.value=r.result;var pv=m.querySelector('[data-prev="'+key+'"]');if(pv){pv.src=r.result;pv.style.opacity=1;}};r.readAsDataURL(file);});});
  m.querySelectorAll('input[data-k]').forEach(function(inp){inp.addEventListener('input',function(){var pv=m.querySelector('[data-prev="'+inp.getAttribute('data-k')+'"]');if(pv){pv.src=inp.value.split('|')[0];pv.style.opacity=1;}});});
  document.getElementById('save').addEventListener('click',function(){
    var obj={};m.querySelectorAll('[data-k]').forEach(function(el){var v=el.value;if(v&&v.trim())obj[el.getAttribute('data-k')]=v;else obj[el.getAttribute('data-k')]=null;});
    try{window.__alizonCMS.set(obj);}catch(e){}
    document.getElementById('savedmsg').textContent='✓ Saved — live for all visitors';
    setTimeout(function(){var s=document.getElementById('savedmsg');if(s)s.textContent='';},4000);
  });
}
function boot(){
  var tries=0;(function w(){ if(window.__alizonCMS&&window.__alizonCMS.fields){ buildTree(); renderSide(); seed(function(){ showDash(); }); showDash(); } else if(++tries<40){ setTimeout(w,150);} })();
}

/* ---------- auto-open AFTER all definitions exist ---------- */
if(new URLSearchParams(location.search).get('admin')==='1'){ try{sessionStorage.setItem('alizonAdminAuth','1');}catch(e){} }
if(adminOk()) openShell();
</script>
</body>
</html>
